# 도메인별 설정. /etc/nginx/sites-available/<도메인> 으로 두고 sites-enabled 에 링크한다.
#
#   sudo cp deploy/site.conf /etc/nginx/sites-available/example.com
#   sudo ln -s /etc/nginx/sites-available/example.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# ⚠️ 바꿀 곳은 `example.com` 과 `/srv/example` 뿐이다 (CHANGE 표시).
#    http{} 공통 설정(레이트리밋 존·프록시 헤더·gzip)은 nginx.conf 참고.

# ══════════════════════════════════════════════════════════════
#  먼저 — TLS 를 누가 끝내는가?
# ══════════════════════════════════════════════════════════════
#
#  | 배포 형태                  | TLS 종단     | nginx 가 들을 포트 | HTTP→HTTPS 리다이렉트 |
#  |----------------------------|--------------|--------------------|------------------------|
#  | Cloudflare (Flexible)      | CF           | 80 만              | **CF 대시보드**        |
#  | Cloudflare (Full strict)   | CF + origin  | 80 + 443           | 아래 80 블록           |
#  | AWS ALB + ACM              | ALB          | 80 만              | **ALB 리스너 규칙**    |
#  | EC2 직접 (certbot)         | nginx        | 80 + 443           | 아래 80 블록           |
#
#  ⚠️ **어느 형태든 HTTP→HTTPS 리다이렉트가 반드시 어딘가에 있어야 한다.**
#     없으면 http:// 로 들어온 사용자에게 `Secure` 쿠키가 저장되지 않아
#     "로그인은 200인데 세션이 안 잡히는" 증상이 난다. 앞단이 끝내는 구성이라면
#     그 리다이렉트는 **앞단에서** 켜야 한다 (nginx 는 그걸 모른다):
#       - Cloudflare: SSL/TLS → Edge Certificates → **Always Use HTTPS: On**
#       - ALB:        80 리스너 → Redirect to HTTPS (443)
#
#  TLS 종단이 앞단이면 아래 443 블록을 통째로 지우고 80 블록만 남긴다
#  (그때 80 블록의 `return 301` 을 지우고 실제 내용을 넣는다).

# ── HTTP ──────────────────────────────────────────────────────
# nginx 가 TLS 를 끝내는 구성에서만 이대로 쓴다 (전량 리다이렉트).
# 앞단이 끝내는 구성이면 이 블록에 아래 443 블록의 내용을 옮긴다.
server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;        # CHANGE

    # certbot 갱신 경로만 예외
    location /.well-known/acme-challenge/ { root /var/www/html; }

    location / { return 301 https://$host$request_uri; }
}

# ── HTTPS ─────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.com www.example.com;        # CHANGE

    # certbot:            /etc/letsencrypt/live/<도메인>/{fullchain,privkey}.pem
    # Cloudflare Origin:  대시보드 SSL/TLS → Origin Server → Create Certificate
    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;   # CHANGE
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;     # CHANGE

    root /srv/example/frontend/dist;                # CHANGE — npm run build 결과
    index index.html;
    charset utf-8;

    # 업로드 한도. backend/app/core/utils/upload.py 의 MAX_UPLOAD_BYTES(10MB)보다
    # 넉넉해야 한다. 작으면 앱이 413을 주기 전에 nginx 가 끊어서
    # 프론트가 BaseResponse 가 아닌 nginx HTML 을 받는다.
    client_max_body_size 12m;

    # 보안 헤더 — 정적 파일은 앱(core/middleware/security.py)을 거치지 않으므로 여기서도.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 흔한 탐색 경로 차단
    location ~* (\.env|\.git|\.htaccess) { deny all; }

    # ── 인증 — 더 빡센 한도 ────────────────────────────────────
    # ⚠️ prefix 매칭은 **긴 쪽이 이긴다.** `/api/auth` 가 `/api` 보다 먼저 잡힌다.
    #    경로를 `/auth` 로 적으면 실제 라우트(`/api/auth/**`)에 매칭되지 않아
    #    이 블록이 죽은 설정이 된다 — 그러면 로그인에 auth_limit 이 안 걸린다.
    location /api/auth {
        limit_req zone=auth_limit burst=10 nodelay;
        proxy_pass http://fastapi_backend;
    }

    # ── WebSocket ──────────────────────────────────────────────
    location /api/ws {
        proxy_pass http://fastapi_backend;
        proxy_read_timeout 3600s;    # WS 는 오래 열려 있다. 300s 로는 끊긴다
        proxy_send_timeout 3600s;
    }

    # ── API ────────────────────────────────────────────────────
    location /api {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://fastapi_backend;
    }

    # ── 업로드된 파일 ──────────────────────────────────────────
    # 앱도 StaticFiles 로 서빙하지만 nginx 가 직접 주는 편이 훨씬 싸다.
    # settings.MEDIA_ROOT = backend/media 를 가리킨다. 끝의 / 필수.
    location /media/ {
        alias /srv/example/backend/media/;          # CHANGE
        access_log off;
        add_header Cache-Control "public, max-age=604800" always;   # 7일
    }

    # ── 정적 자산 ──────────────────────────────────────────────
    # vite 가 파일명에 해시를 붙이므로(vite.config.ts) 장기 캐시가 안전하다.
    location ^~ /assets/ {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # robots.txt · sitemap.xml · llms.txt 는 자주 바뀐다
    location ~ ^/(robots\.txt|sitemap\.xml|llms\.txt)$ {
        expires 1h;
        access_log off;
    }

    # ── SPA fallback ───────────────────────────────────────────
    # 없는 경로도 index.html 을 주고, react-router 의 `path="*"` 가
    # NotFound 화면을 그린다 (frontend/src/container/notfound.tsx).
    # **사람에게는 이걸로 충분하다.**
    #
    # 다만 HTTP 상태는 200 이라 기계에게는 "존재하는 페이지" 로 보인다:
    #   - 검색엔진: 쓰레기 URL 이 전부 색인된다 (구글이 "soft 404" 로 부르는 것).
    #              깨진 링크·옛 URL·스크래퍼가 만든 주소가 내용이 똑같은
    #              얇은 페이지 수천 개가 되어 크롤 예산을 태운다
    #   - 모니터링: 200 은 성공으로 집계되어 깨진 링크가 대시보드에 안 뜬다
    #
    # ⚠️ **언제 신경 쓸지** — 관리자 도구·사내 도구·로그인 뒤에서만 쓰는 서비스라면
    #    크롤러가 올 일이 없으므로 이대로 두는 게 맞다. 공개 랜딩·소개 페이지가
    #    검색에 떠야 할 때만 아래 "프리렌더" 로 간다 (그러면 soft 404 도 같이 풀린다).
    location / {
        try_files $uri $uri/ /index.html;
        access_log off;
    }

    # index.html 은 절대 캐시하지 않는다 — 배포해도 옛 번들을 가리키게 된다
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }
}

# ══════════════════════════════════════════════════════════════
#  프리렌더 — 공개 페이지에 검색 노출이 필요해졌을 때
# ══════════════════════════════════════════════════════════════
#
# 이 템플릿의 프론트는 CSR 이다. curl 로 받으면 <div id="root"> 뿐이라 본문이 없다.
# 로그인 뒤에서만 쓰는 관리자 도구라면 이대로가 맞다 — 아래는 **공개 랜딩·FAQ 가
# 검색에 떠야 할 때만** 한다.
#
# 1) 빌드 시 공개 라우트만 HTML 로 굽는다
#      npm i -D @prerenderer/rollup-plugin @prerenderer/renderer-puppeteer
#
#    vite.config.ts:
#      prerender({
#        routes: ["/", "/about", "/faq"],     // 공개 라우트만. /admin 은 넣지 말 것
#        renderer: "@prerenderer/renderer-puppeteer",
#      })
#
# 2) nginx 는 그대로 둔다 — try_files 가 /about/ → /about/index.html 을 먼저 찾는다.
#
# 3) soft 404 도 여기서 같이 풀린다. dist/ 에 **실제 라우트만** 파일로 존재하므로,
#    fallback 을 끄면 없는 경로가 자연히 404 가 된다:
#
#      location / { try_files $uri $uri/ =404; }
#
#    ⚠️ 프리렌더 없이 이 줄만 바꾸면 **모든 라우트가 404** 가 된다 (dist 에 파일이
#       index.html 하나뿐이므로). 굳이 프리렌더 없이 하려면 라우트를 손으로 적어야
#       하는데, App.tsx 와 이중 관리가 되어 라우트를 추가할 때마다 어긋난다:
#
#         location ~ ^/(|about|faq)$ { try_files $uri $uri/ /index.html; }
#         location / { try_files $uri $uri/ =404; }
#
# 4) 검증 — "코드에 있다" 가 아니라 "JS 없이 받은 HTML 에 있다" 가 기준이다
#      curl -sL https://example.com/about | grep -c "<h1"          # 0 이면 실패
#      curl -s -o /dev/null -w '%{http_code}' https://example.com/없는페이지   # 404 여야
#
# 라우트를 추가할 때마다 목록을 갱신해야 한다. 부담이면 SSR 프레임워크로
# 프론트를 교체하는 쪽이 장기적으로 낫다. 판단 기준은 `.claude/skills/seo/SKILL.md`.
