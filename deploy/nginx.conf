# /etc/nginx/nginx.conf 의 http{} 블록에 해당하는 부분.
# 배포 형태와 무관하게 공통이다. 도메인별 설정은 site.conf 를 참고.
#
# 기존 nginx.conf 를 통째로 바꾸기보다, 아래 블록들을 골라 넣는 편이 안전하다
# (배포판 기본 설정에 이미 들어있는 항목이 있다).

user  www-data;          # Ubuntu 기본. AMI 에 따라 ubuntu / nginx
worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 10240;
}

http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    types_hash_max_size 4096;
    server_tokens off;                      # 버전 노출 차단

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # ── gzip ──────────────────────────────────────────────────
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;          # 프록시·CDN 이 압축본/원본을 구분해 캐시하도록
    gzip_proxied any;      # 프록시 뒤에서도 압축 (없으면 CDN 뒤에서 안 먹는다)
    gzip_types
        text/plain text/css text/xml
        application/json application/javascript application/xml
        application/rss+xml image/svg+xml;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # ── 레이트리밋 존 ──────────────────────────────────────────
    # 앞단(nginx)은 "초당 수백 발" 같은 거친 폭주를 앱에 닿기 전에 쳐낸다.
    # 계정 단위 제한처럼 정교한 것은 앱이 한다 (core/utils/rate_limit.py).
    # 둘은 역할이 달라서 **둘 다** 있어야 한다.
    limit_req_zone $binary_remote_addr zone=api_limit:10m  rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;
    limit_req_status 429;

    # ── upstream ──────────────────────────────────────────────
    upstream fastapi_backend {
        server 127.0.0.1:8000;
        keepalive 32;
    }

    # ── WebSocket 업그레이드 ───────────────────────────────────
    # 일반 요청에는 Connection: close, 업그레이드 요청에만 upgrade 를 보낸다.
    # `Connection "upgrade"` 를 하드코딩하면 일반 요청에도 붙어서 지저분해진다.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ── 원래 스킴 판별 ─────────────────────────────────────────
    # TLS 를 앞단(Cloudflare·ALB)이 끝내면 nginx 는 평문 HTTP 로 받는다.
    # 그때 $scheme 은 "http" 라, 앞단이 보낸 X-Forwarded-Proto 를 우선한다.
    # nginx 가 직접 TLS 를 끝내는 구성에서는 $scheme 이 그대로 쓰인다.
    map $http_x_forwarded_proto $real_scheme {
        default $scheme;
        "~.+"   $http_x_forwarded_proto;
    }

    # ── 공통 프록시 헤더 ───────────────────────────────────────
    # ⚠️ X-Real-IP / X-Forwarded-For 는 **레이트리밋의 전제다.**
    #    없으면 모든 방문자가 127.0.0.1 하나로 뭉쳐서 서비스 전체가 한 한도로 묶인다.
    #    (core/utils/rate_limit.py 는 peer 가 사설망일 때만 이 헤더를 믿는다)
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $real_scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  $server_port;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_read_timeout    300s;
    proxy_send_timeout    300s;
    proxy_connect_timeout 60s;

    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/sites-enabled/*;
}
