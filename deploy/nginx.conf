# 운영 nginx 설정. 프론트(정적) + 백엔드(uvicorn)를 한 호스트에서 서빙한다.
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/example.com
#   sudo ln -s /etc/nginx/sites-available/example.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# ⚠️ 바꿔야 하는 곳은 `example.com` 과 `/srv/example` 두 개뿐이다 (아래 주석의 CHANGE 표시).
#
# 이 구성을 전제로 한 이유 — 이 템플릿의 인증은 프론트 JS가 `user_info` 쿠키를 직접 읽는다.
# 따라서 프론트와 API가 **같은 사이트**여야 하고, 그래야 `SameSite=Lax` 로 CSRF가 막힌다.
# 프론트를 Vercel 등 다른 도메인에 올리면 쿠키를 읽을 수 없고 `cookie_samesite=none` 이
# 필요해지는데, 그 순간 CSRF 방어를 따로 붙여야 한다. (backend/CLAUDE.md 참고)

upstream base_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

# HTTP → HTTPS. 인증서는 certbot 으로 발급한다:
#   sudo certbot --nginx -d example.com -d www.example.com
server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;    # CHANGE

    # certbot 갱신용 경로만 열어둔다
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.com www.example.com;    # CHANGE

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;   # CHANGE
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;     # CHANGE

    root /srv/example/frontend/dist;            # CHANGE — npm run build 결과물
    index index.html;

    # 업로드 용량. backend/app/core/utils/upload.py 의 MAX_UPLOAD_BYTES(10MB)보다
    # 넉넉해야 한다. 여기가 작으면 앱이 413을 주기 전에 nginx가 먼저 끊어서
    # 프론트가 BaseResponse 가 아닌 nginx HTML 을 받는다.
    client_max_body_size 12m;

    # 보안 헤더는 앱(core/middleware/security.py)도 붙이지만, 정적 파일은 앱을
    # 거치지 않으므로 여기서도 붙인다.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;

    # ── API ────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://base_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # ⚠️ 이 세 줄이 레이트리밋의 전제다. 없으면 모든 방문자가 127.0.0.1 하나로
        #    뭉쳐서 서비스 전체가 10req/분으로 묶인다.
        #    (core/utils/rate_limit.py 는 peer 가 사설망일 때만 이 헤더를 믿는다)
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
    }

    # ── WebSocket ──────────────────────────────────────────────
    # /api/ 블록보다 **먼저** 매칭돼야 해서 정규식(^~ 아님)을 쓴다.
    location /api/ws {
        proxy_pass http://base_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # WS는 오래 열려 있으므로 기본 60초로는 끊긴다
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── 업로드된 파일 ───────────────────────────────────────────
    # 앱이 StaticFiles 로도 서빙하지만, nginx 가 직접 주는 편이 훨씬 싸다.
    # 경로는 backend/media 를 가리킨다 (settings.MEDIA_ROOT).
    location /media/ {
        alias /srv/example/backend/media/;      # CHANGE — 끝의 / 필수
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── 정적 자산 ───────────────────────────────────────────────
    # vite 빌드 산출물은 파일명에 해시가 붙으므로(vite.config.ts 의 entryFileNames)
    # 장기 캐시가 안전하다.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # robots.txt · sitemap.xml · llms.txt 는 짧게 캐시한다 (자주 바뀐다)
    location ~ ^/(robots\.txt|sitemap\.xml|llms\.txt)$ {
        expires 1h;
        access_log off;
    }

    # ── SPA fallback ───────────────────────────────────────────
    # 어떤 경로든 index.html 을 돌려준다 (react-router 가 클라이언트에서 라우팅).
    #
    # ⚠️ 이 줄 때문에 **없는 경로도 200을 준다.** 검색엔진에게는 "모든 URL이 존재"로
    #    보이므로 soft 404 문제가 된다. 공개 검색 노출이 목표라면 아래
    #    "프리렌더" 주석을 참고할 것.
    location / {
        try_files $uri $uri/ /index.html;

        # index.html 은 절대 캐시하지 않는다 — 배포해도 옛 번들을 가리키게 된다
        location = /index.html {
            add_header Cache-Control "no-store, must-revalidate";
        }
    }
}

# ══════════════════════════════════════════════════════════════
#  프리렌더 — 공개 페이지에 검색 노출이 필요해졌을 때
# ══════════════════════════════════════════════════════════════
#
# 이 템플릿의 프론트는 CSR 이다. `curl` 로 받으면 <div id="root"> 뿐이라 본문이 없고,
# 위 SPA fallback 때문에 없는 경로도 200 을 준다. 로그인 뒤에서만 쓰는 관리자 도구라면
# 이대로가 맞다 — 아래는 **공개 랜딩·소개·FAQ 가 검색에 떠야 할 때만** 한다.
#
# 1) 빌드 시 공개 라우트만 HTML 로 굽는다
#
#      npm i -D @prerenderer/rollup-plugin @prerenderer/renderer-puppeteer
#
#    vite.config.ts:
#      import prerender from "@prerenderer/rollup-plugin";
#      plugins: [
#        react(),
#        prerender({
#          routes: ["/", "/about", "/faq"],        // 공개 라우트만. /admin 은 넣지 말 것
#          renderer: "@prerenderer/renderer-puppeteer",
#          postProcess(rendered) {
#            // 라우트별 <title>·description 을 여기서 주입한다
#            return rendered;
#          },
#        }),
#      ]
#
#    결과: dist/index.html, dist/about/index.html, dist/faq/index.html (본문 포함)
#
# 2) nginx 는 그대로 둔다. `try_files $uri $uri/ /index.html` 이 이미
#    /about/ → /about/index.html 을 먼저 찾으므로 구운 파일이 우선한다.
#
# 3) 구워지지 않은 경로에서 soft 404 를 없애려면, 존재하는 라우트를 명시하고
#    나머지는 404 를 주도록 바꾼다:
#
#      location / {
#          try_files $uri $uri/ =404;
#      }
#      location ~ ^/(|about|faq)$ {          # 실제 공개 라우트만
#          try_files $uri $uri/ /index.html;
#      }
#
# 4) 검증 — "코드에 있다"가 아니라 "JS 없이 받은 HTML에 있다"가 기준이다
#
#      curl -sL https://example.com/about | grep -c "<h1"     # 0이면 실패
#
# 라우트를 추가할 때마다 위 `routes` 목록을 갱신해야 한다. 그게 부담이면
# SSR 프레임워크(Next.js 등)로 프론트를 교체하는 쪽이 장기적으로 낫다.
# 자세한 판단 기준은 `.claude/skills/seo/SKILL.md` 의 "이 템플릿에서의 출발점".
