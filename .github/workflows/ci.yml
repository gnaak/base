# CLAUDE.md 의 "검증 명령"을 파이프라인에 고정한다.
# 사람이 기억해서 돌리는 것과, 못 돌리면 머지가 막히는 것은 다르다.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# 같은 브랜치에 연달아 푸시하면 이전 실행을 취소한다
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (pytest)
    runs-on: ubuntu-latest

    # docker-compose.yml 과 같은 이미지·같은 healthcheck 를 쓴다.
    # ⚠️ mysqladmin ping 은 -h 127.0.0.1 로 TCP 확인을 해야 한다 —
    #    초기화 중 임시 서버는 소켓으로만 응답해서, 소켓 ping 이면
    #    준비되기 전에 healthy 로 잡힌다.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 로컬 .venv 와 같은 버전으로 고정한다
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: 의존성 설치
        working-directory: backend
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: DB 생성
        run: |
          mysql -h 127.0.0.1 -u root -e "
            CREATE DATABASE IF NOT EXISTS db_example    CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
            CREATE DATABASE IF NOT EXISTS db_base_test  CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
          "

      - name: .env 준비
        working-directory: backend
        run: |
          cp .env.example .env
          # .env.example 의 시크릿은 비어 있다. dotenv 는 뒤에 온 키가 이긴다.
          {
            echo "jwt_secret=ci-$(openssl rand -hex 32)"
            echo "hash_key=ci-$(openssl rand -hex 32)"
          } >> .env

      # 린트를 테스트보다 먼저 — 빨리 실패하는 쪽을 앞에 둔다
      - name: ruff
        working-directory: backend
        run: ruff check .

      - name: pytest
        working-directory: backend
        run: python -m pytest -q

  frontend:
    name: frontend (types · lint · test · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 의존성 설치
        working-directory: frontend
        run: npm ci

      # vite build 는 VITE_* 값이 없어도 통과하지만, 빈 값으로 빌드되는 것을
      # 그대로 두면 "왜 API 를 못 부르지" 를 나중에 겪는다. example 을 쓴다.
      - name: .env 준비
        working-directory: frontend
        run: cp .env.example .env

      - run: npm run check:types
        working-directory: frontend

      - run: npm run lint
        working-directory: frontend

      - run: npm test
        working-directory: frontend

      - run: npm run build
        working-directory: frontend

  docker:
    name: backend 이미지 빌드
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # 배포 직전에야 "빌드가 깨져 있었네" 를 알게 되는 상황을 막는다.
      # push 는 하지 않는다 — 레지스트리를 쓰게 되면 여기에 태그·푸시를 붙인다.
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
