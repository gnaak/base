# CLAUDE.md 의 "검증 명령"을 파이프라인에 고정한다.
# 사람이 기억해서 돌리는 것과, 못 돌리면 머지가 막히는 것은 다르다.
#
# main 에 푸시하면 테스트 → 통과하면 배포 (deploy 잡). 배포는 infra/ 로 AWS 를 연결한
# 저장소에서만 돈다 — 연결 전에는 **건너뛴다** (실패가 아니다).
# Actions 탭 → CI → Run workflow 로 같은 걸 손으로 돌릴 수도 있다 (재배포).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# PR 은 연달아 푸시하면 이전 실행을 취소한다.
# ⚠️ main 은 취소하지 않는다 — 배포 도중 끊기면 반쯤 교체된 서버가 남는다.
#    다음 푸시는 앞 실행이 끝날 때까지 기다린다 (대기는 최신 하나만 남는다)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: backend (pytest)
    runs-on: ubuntu-latest

    # docker-compose.yml 과 같은 이미지·같은 healthcheck 를 쓴다.
    # ⚠️ mysqladmin ping 은 -h 127.0.0.1 로 TCP 확인을 해야 한다 —
    #    초기화 중 임시 서버는 소켓으로만 응답해서, 소켓 ping 이면
    #    준비되기 전에 healthy 로 잡힌다.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      # 파이썬 설치도 uv 가 한다 (backend/.python-version 기준).
      # setup-python 을 따로 두면 "CI 는 되는데 로컬은 안 되는" 버전 차이가 생긴다.
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.4"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: 의존성 설치
        working-directory: backend
        # --frozen: lock 과 pyproject 가 어긋나 있으면 조용히 재해결하지 않고 **실패**한다.
        # 누가 pyproject 만 고치고 lock 을 안 올린 PR 이 여기서 걸린다.
        run: uv sync --frozen --all-groups

      - name: DB 생성
        run: |
          mysql -h 127.0.0.1 -u root -e "
            CREATE DATABASE IF NOT EXISTS db_example    CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
            CREATE DATABASE IF NOT EXISTS db_base_test  CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
          "

      - name: .env 준비
        working-directory: backend
        run: |
          cp .env.example .env
          # .env.example 의 시크릿은 비어 있다. dotenv 는 뒤에 온 키가 이긴다.
          {
            echo "jwt_secret=ci-$(openssl rand -hex 32)"
            echo "hash_key=ci-$(openssl rand -hex 32)"
          } >> .env

      # 린트를 테스트보다 먼저 — 빨리 실패하는 쪽을 앞에 둔다
      - name: ruff
        working-directory: backend
        run: uv run --frozen ruff check .

      - name: pytest
        working-directory: backend
        run: uv run --frozen pytest -q

  frontend:
    name: frontend (types · lint · test · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 의존성 설치
        working-directory: frontend
        run: npm ci

      # vite build 는 VITE_* 값이 없어도 통과하지만, 빈 값으로 빌드되는 것을
      # 그대로 두면 "왜 API 를 못 부르지" 를 나중에 겪는다. example 을 쓴다.
      - name: .env 준비
        working-directory: frontend
        run: cp .env.example .env

      - run: npm run check:types
        working-directory: frontend

      - run: npm run lint
        working-directory: frontend

      - run: npm test
        working-directory: frontend

      - run: npm run build
        working-directory: frontend

  # 인프라 코드 — 키 없이 돈다 (mock provider). edge 두 방식이 다 plan 되는지 본다
  infra:
    name: infra (terraform validate · test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: terraform 버전 (로컬 tf.ps1 과 같은 값)
        id: tf
        run: echo "version=$(tr -d ' \r\n' < infra/.terraform-version)" >> "$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ steps.tf.outputs.version }}

      - name: fmt · validate · test
        working-directory: infra
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate
          terraform test

      - name: 서버 스크립트 문법
        run: bash -n infra/server/deploy.sh && bash -n infra/server/cloud-init.sh && sh -n infra/tf.sh

  # Docker 는 배포에 쓰지 않는다 — EC2 에 nginx + systemd 로 직접 올린다 (infra/server/deploy.sh)
  deploy:
    name: deploy
    needs: [backend, frontend, infra]
    # AWS 연결 전(템플릿 그대로·막 clone 한 저장소)에는 건너뛴다.
    # 연결 = infra/ apply 후 `tf.ps1 output github_variables` 의 세 변수를 저장소에 넣는 것
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      id-token: write # OIDC — AWS 키 없이 임시 권한을 받는다 (infra/github.tf)
      contents: read
    env:
      PROJECT: ${{ vars.APP_PROJECT }}
      AWS_REGION: ${{ vars.AWS_REGION }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # SSM /<project>/deploy/* → 이후 스텝의 환경변수, /<project>/frontend/* → .env.production
      - name: 배포 설정 읽기
        run: |
          get() {
            aws ssm get-parameters-by-path --path "/$PROJECT/$1/" \
              --query 'Parameters[].[Name,Value]' --output text
          }
          get deploy | while IFS=$'\t' read -r name value; do echo "${name##*/}=$value"; done >> "$GITHUB_ENV"
          get frontend | while IFS=$'\t' read -r name value; do echo "${name##*/}=$value"; done > frontend/.env.production
          echo "── frontend/.env.production (번들에 박히는 공개 값)"
          cat frontend/.env.production
          grep -q '^VITE_APP_PUBLIC_BASE_URL=' frontend/.env.production

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 프론트 빌드 (운영 값)
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # 서버에 필요한 것만 묶는다. 테스트·가상환경·로컬 .env 는 빠진다
      - name: 릴리스 묶기 · 올리기
        run: |
          test -n "$instance_id" && test -n "$release_bucket"
          tar -czf release.tgz \
            --exclude=backend/tests --exclude=backend/.venv --exclude='__pycache__' \
            --exclude=backend/logs --exclude=backend/media --exclude='backend/.env*' \
            backend frontend/dist deploy infra/server
          ls -lh release.tgz
          aws s3 cp release.tgz "s3://$release_bucket/releases/$GITHUB_SHA.tgz" --only-show-errors

      # 서버가 받아서 infra/server/deploy.sh 를 돌린다. 그 스크립트의 확인(헬스체크 ·
      # 근거: APP_ENV · nginx 경유)이 하나라도 실패하면 이 스텝이 실패한다
      - name: 서버에 배포
        run: |
          params=$(jq -n --arg b "$release_bucket" --arg s "$GITHUB_SHA" --arg r "$AWS_REGION" '{
            commands: [
              "d=/tmp/release-\($s); rm -rf $d $d.tgz; mkdir -p $d",
              "/usr/local/bin/aws s3 cp s3://\($b)/releases/\($s).tgz $d.tgz --region \($r) --only-show-errors && tar -xzf $d.tgz -C $d && bash $d/infra/server/deploy.sh $d; rc=$?; rm -rf $d $d.tgz; exit $rc"
            ],
            executionTimeout: ["1800"]
          }')
          id=$(aws ssm send-command --instance-ids "$instance_id" --document-name AWS-RunShellScript \
            --comment "deploy $GITHUB_SHA" --parameters "$params" --query Command.CommandId --output text)
          echo "SSM 명령: $id"

          status=Pending
          for _ in $(seq 1 180); do
            sleep 10
            status=$(aws ssm get-command-invocation --command-id "$id" --instance-id "$instance_id" \
              --query Status --output text 2>/dev/null || echo Pending)
            case $status in Pending | InProgress | Delayed) continue ;; *) break ;; esac
          done

          inv() { aws ssm get-command-invocation --command-id "$id" --instance-id "$instance_id" --query "$1" --output text; }
          echo "── 서버 출력"; inv StandardOutputContent
          echo "── 서버 에러"; inv StandardErrorContent
          echo "상태: $status"
          test "$status" = Success

      # deploy/README.md "배포 후 확인" 중 밖에서만 볼 수 있는 것 — CF → nginx → 앱 전 구간
      - name: 외부 확인
        run: |
          test -n "$domain"
          code=000
          for _ in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://$domain/api/health" || true)
            [ "$code" = 200 ] && break
            sleep 10
          done
          echo "https://$domain/api/health → $code"
          # 526 = CF 가 서버 인증서를 거부 (Origin 인증서가 안 깔림) / 52x = CF 가 서버에 못 붙음
          test "$code" = 200

          # ⚠️ http:// 가 200 이면 Secure 쿠키가 저장되지 않아 "로그인은 200인데 세션이 안 잡힘" 이 난다
          first=$(curl -sSI "http://$domain/" | head -1)
          echo "http://$domain/ → $first"
          echo "$first" | grep -qE ' 30[178] '
