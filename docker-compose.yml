# 로컬 개발용 MySQL + Redis.
#
#   docker compose up -d
#
# ⚠️ 값은 backend/.env의 local_* 항목과 반드시 일치해야 한다.
#    (local_mysql_user / local_mysql_password / local_mysql_db / local_redis_password)
services:
  mysql:
    image: mysql:8.4
    container_name: base-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 'changeme'
      MYSQL_DATABASE: db_swing
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      # 127.0.0.1로 고정한다. backend/.env의 local_mysql_host와 맞추고,
      # 호스트를 localhost/127.0.0.1로 섞어 쓰지 않기 위해서다.
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pchangeme"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: base-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "1234"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "1234", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql-data:
  redis-data:
