# 백엔드의 단일 설정 파일 — 의존성(uv) + ruff + pytest.
#
# 의존성은 **여기에만** 적는다. 정확한 버전은 `uv.lock` 이 잡는다.
# (예전엔 requirements.txt / requirements-dev.txt 로 freeze 했는데,
#  freeze 는 "내 윈도우에서 풀린 결과" 라 리눅스 서버에서 같다는 보장이 없었다.
#  uv.lock 은 플랫폼별 해시까지 들고 있어서 재현성이 더 높다.)
#
#   uv sync                  # 개발 (dev 그룹 포함)
#   uv sync --no-dev         # 운영
#   uv add httpx             # 패키지 추가 (pyproject + lock 동시 갱신)
#   uv lock --upgrade        # 전체 업그레이드
#   uv export --no-dev --no-emit-project > requirements.txt   # pip 만 되는 곳용 탈출구

[project]
name = "base-backend"
version = "0.1.0"
description = "FastAPI + SQLAlchemy 풀스택 템플릿의 백엔드"
# `.python-version` 과 Dockerfile(python:3.12-slim), CI 가 모두 3.12 다.
# uv 는 이 범위에 맞는 인터프리터를 **없으면 직접 받아서** 쓴다 —
# "파이썬 버전이 달라서" 나던 문제가 여기서 끝난다.
requires-python = ">=3.12,<3.13"

dependencies = [
    # ── 웹 ──
    "fastapi>=0.135.2",
    "uvicorn>=0.42.0",
    "starlette>=1.0.0",       # 예외 핸들러·미들웨어에서 직접 import 한다
    "websockets>=15.0.1",     # uvicorn 의 WebSocket 구현
    "python-multipart>=0.0.32", # UploadFile / Form
    # ── DB ──
    "sqlalchemy>=2.0.54",
    "aiomysql>=0.2.0",
    "alembic>=1.18.4",
    "redis>=7.3.0",
    # ── 설정·검증 ──
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "python-dotenv>=1.2.2",
    # ── 인증 ──
    "pyjwt>=2.12.1",
    "passlib>=1.7.4",
    "argon2-cffi>=25.1.0",    # passlib 의 argon2 백엔드
    # ── 기타 ──
    "httpx>=0.28.1",          # OAuth 토큰 교환
    "pytz>=2026.1.post1",
    "openai>=2.29.0",
]

[dependency-groups]
# 개발·테스트 전용. `uv sync --no-dev` 면 빠진다 (운영 이미지에 안 들어간다).
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.4.0",
    "fakeredis>=2.34.1",
    "ruff>=0.16.8",
]
# systemd(deploy/fastapi.service) 로 띄울 때만 필요하다.
# Docker 이미지는 uvicorn 을 직접 실행하므로 안 쓴다.
#   uv sync --no-dev --group prod
# ⚠️ gunicorn 은 윈도우에서 **실행되지 않는다** (fcntl). 설치는 되니 lock 에는 남는다.
prod = ["gunicorn>=23.0.0"]

[tool.uv]
# 이 저장소는 배포할 라이브러리가 아니라 앱이다. 자기 자신을 빌드·설치하지 않는다
# (`[project]` 가 있어도 uv 가 `pip install -e .` 를 하지 않게 만드는 스위치).
package = false
# 기본 sync 대상. `uv sync` 만 쳐도 dev 가 들어온다.
default-groups = ["dev"]

# ── ruff ──────────────────────────────────────────────────────
#   uv run ruff check .          # 검사
#   uv run ruff check . --fix    # 자동 수정
#   uv run ruff format .         # 포매팅 (선택)
[tool.ruff]
# 88(기본)이면 한글 주석이 많은 이 코드베이스에서 E501 이 90개 넘게 뜬다.
# 110 이면 5개까지 줄고, 그 5개는 실제로 줄일 만한 줄이었다.
line-length = 110
# 런타임은 3.12 지만 린트 기준은 일부러 py311 로 둔다.
# py312 로 올리면 UP046 이 `class Page(BaseModel, Generic[T])` 를 PEP 695
# (`class Page[T](BaseModel)`) 로 바꾸라고 하는데, Pydantic 제네릭 모델에서
# 이 문법은 아직 굳이 갈아탈 이유가 없다. 바꾸고 싶어지면 py312 로 올리면 된다.
target-version = "py311"
extend-exclude = [".venv", "alembic/versions"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle 에러
    "W",   # pycodestyle 경고
    "F",   # pyflakes (미사용 import·변수 등)
    "I",   # import 정렬 (제거한 isort 를 대신한다)
    "UP",  # pyupgrade (Optional[X] → X | None 등)
    "B",   # flake8-bugbear (흔한 함정)
    "C4",  # 불필요한 컴프리헨션
    "SIM", # 단순화 가능한 구문
]
ignore = [
    # FastAPI 는 `p: Provider = Depends(...)` 처럼 기본값에서 함수를 부르는 게 **관용구**다.
    # 이 규칙을 켜면 프레임워크 사용법 전체가 경고로 뜬다.
    "B008",
    # `except` 안에서 `raise ... from e` 를 강제한다. 이 코드베이스의 해당 지점들은
    # 업스트림 예외를 API 에러로 **번역**하는 자리이고 원본은 이미 로그에 남긴다.
    # (파이썬이 __context__ 로 자동 연결하므로 트레이스백도 유지된다)
    "B904",
]

[tool.ruff.lint.per-file-ignores]
# 모델을 import 해서 Base.metadata 에 등록하는 파일이다.
# "쓰지 않는 import" 가 맞지만 **그게 목적**이라 지우면 Alembic 이 테이블을 놓친다.
"app/module/__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

# ── pytest ────────────────────────────────────────────────────
#   uv run pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

# async 테스트에 데코레이터를 매번 붙이지 않는다.
asyncio_mode = "auto"

# 세션 스코프 엔진과 함수 스코프 세션이 같은 이벤트 루프를 써야 한다.
# 루프가 갈리면 "attached to a different loop" 로 터진다.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

addopts = "-q --strict-markers"
