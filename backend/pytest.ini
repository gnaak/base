[pytest]
testpaths = tests
pythonpath = .

# async 테스트에 데코레이터를 매번 붙이지 않는다.
asyncio_mode = auto

# 세션 스코프 엔진과 함수 스코프 세션이 같은 이벤트 루프를 써야 한다.
# 루프가 갈리면 "attached to a different loop" 로 터진다.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session

addopts = -q --strict-markers
